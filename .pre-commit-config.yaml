repos:
  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  # Prettier for code formatting: the repo's own pinned version, so the hook
  # and CI's `npm run format:check` agree. Exclusions live in .prettierignore.
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        files: \.(js|jsx|ts|tsx|json|yaml|yml|md|css)$

  # ESLint
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: \.(js|jsx|ts|tsx)$

  # TypeScript type checking (re-enabled after fixing errors)
  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript Type Check
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$

  # Security audit
  - repo: local
    hooks:
      - id: audit
        name: Security Audit
        entry: npm audit --audit-level moderate
        language: system
        pass_filenames: false
        files: package-lock\.json$

  # Jest tests
  - repo: local
    hooks:
      - id: test
        name: Jest Tests
        entry: npm test -- --watchAll=false --passWithNoTests --coverage=false
        language: system
        pass_filenames: false
        files: \.(js|jsx|ts|tsx)$

  # Terraform linting and validation
  - repo: local
    hooks:
      - id: terraform_fmt
        name: Terraform Format
        entry: terraform fmt -check -diff
        language: system
        pass_filenames: false
        files: \.tf$

      - id: terraform_validate
        name: Terraform Validate
        entry: terraform validate
        language: system
        pass_filenames: false
        files: \.tf$

      - id: tflint
        name: TFLint
        entry: tflint
        language: system
        pass_filenames: false
        files: \.tf$

  # Ansible linting (temporarily disabled due to exclude pattern issues)
